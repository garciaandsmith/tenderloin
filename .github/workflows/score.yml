name: Score Inbox Tenders
run-name: "score:${{ inputs.project_id || 'all' }}"

on:
  # Triggered automatically by retrain.yml after a new model is saved,
  # or manually from the GitHub Actions UI (e.g. Actualizar Inbox).
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project UUID to score (leave empty to score all active projects)'
        required: false
        type: string

jobs:
  score:
    name: Filter → Score
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      # ── Step 1: Filter ─────────────────────────────────────────────────────
      - name: Apply per-project hard filters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            python -m pipeline.run_filter --project-id "$PROJECT_ID"
          else
            python -m pipeline.run_filter
          fi

      # ── Step 2: Score ──────────────────────────────────────────────────────
      # Loads the trained model from Supabase Storage and applies it.
      # Training is a separate step — see retrain.yml.
      - name: Score tenders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            python -m pipeline.run_score --project-id "$PROJECT_ID"
          else
            python -m pipeline.run_score
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Score job failed at $(date -u) for project '${{ inputs.project_id }}'. Check the Actions log."
