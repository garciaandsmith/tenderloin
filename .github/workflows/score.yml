name: Score Inbox Tenders

on:
  # Trigger manually from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project UUID to re-score (leave empty to score all active projects)'
        required: false
        type: string

jobs:
  score:
    name: Filter → Train → Score
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the scoring-model-latest release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi

      # ── Step 1: Filter ─────────────────────────────────────────────────────
      - name: Apply per-project hard filters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            python -m pipeline.run_filter --project-id "$PROJECT_ID"
          else
            python -m pipeline.run_filter
          fi

      # ── Step 2: Train ──────────────────────────────────────────────────────
      # Always trains all projects so the model release stays up to date.
      - name: Train per-project scoring models and publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline.run_train --publish

      # ── Step 3: Score ──────────────────────────────────────────────────────
      - name: Score active tenders (per project)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            python -m pipeline.run_score --project-id "$PROJECT_ID"
          else
            python -m pipeline.run_score
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Score job failed at $(date -u) for project '${{ inputs.project_id }}'. Check the Actions log."
