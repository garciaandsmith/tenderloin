name: Score Inbox Tenders

on:
  # Trigger manually from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project UUID to re-score (leave empty to score all active projects)'
        required: false
        type: string

jobs:
  score:
    name: Filter → Score
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi

      # ── Step 1: Filter ─────────────────────────────────────────────────────
      - name: Apply per-project hard filters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.run_filter

      # ── Step 2: Score ──────────────────────────────────────────────────────
      - name: Download per-project scoring models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p models
          gh release download scoring-model-latest \
            --repo ${{ github.repository }} \
            --pattern "scoring_*_v????????.pkl" \
            --dir models/ \
            --clobber 2>/dev/null \
          || echo "No model release found — scoring will be skipped for projects without a model."

      - name: Score filter-passing tenders (per project)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.run_score

      - name: Notify on failure
        if: failure()
        run: |
          echo "Score job failed at $(date -u) for project '${{ inputs.project_id }}'. Check the Actions log."
