name: Retrain Scoring Model
run-name: "retrain:${{ inputs.project_id || 'all' }}"

on:
  # Triggered automatically via API when a user submits training scores.
  # Also triggerable manually from the GitHub Actions UI.
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project UUID to retrain (leave empty to retrain all active projects)'
        required: false
        type: string

jobs:
  retrain:
    name: Retrain per-project relevance scoring models
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the scoring-model-latest release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi

      - name: Train scoring model and publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            python -m pipeline.run_train --publish --project-id "$PROJECT_ID"
          else
            python -m pipeline.run_train --publish
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Retraining job failed at $(date -u) for project '${{ inputs.project_id }}'. Check the Actions log."
          # Add Slack/email notification here if needed in the future.
