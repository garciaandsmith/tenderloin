name: Monthly Model Retraining

on:
  schedule:
    # First day of each month at 06:00 UTC (before the daily capture at 07:00)
    - cron: '0 6 1 * *'
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  retrain:
    name: Retrain per-project relevance scoring models
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi

      - name: Train one model per active project and publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline.run_train --publish

      - name: Notify on failure
        if: failure()
        run: |
          echo "Retraining job failed at $(date -u). Check the Actions log."
          # Add Slack/email notification here if needed in the future.
