name: Ingest Historical Tenders

on:
  workflow_dispatch:
    inputs:
      # New format: YYYY-MM strings (used by the admin panel API)
      start_month:
        description: 'Start month in YYYY-MM format (e.g. 2024-01)'
        required: false
        default: ''
      end_month:
        description: 'End month in YYYY-MM format (e.g. 2024-12). Defaults to current month.'
        required: false
        default: ''
      # Legacy format kept for manual triggers from the GitHub UI
      from_year:
        description: '[Legacy] Start year (ignored when start_month is set)'
        required: false
        default: '2022'
      from_month:
        description: '[Legacy] Start month 1–12 (ignored when start_month is set)'
        required: false
        default: '1'
      to_year:
        description: '[Legacy] End year (ignored when start_month is set)'
        required: false
        default: ''
      to_month:
        description: '[Legacy] End month 1–12 (ignored when start_month is set)'
        required: false
        default: ''

jobs:
  ingest_historical:
    name: Bulk ingest historical PLACSP ZIPs into tenders_ingested
    runs-on: ubuntu-latest
    # Historical ingestion can take a long time for wide date ranges
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi

      - name: Build date-range args
        id: args
        run: |
          START_MONTH="${{ github.event.inputs.start_month }}"
          END_MONTH="${{ github.event.inputs.end_month }}"
          FROM_YEAR="${{ github.event.inputs.from_year }}"
          FROM_MONTH="${{ github.event.inputs.from_month }}"
          TO_YEAR="${{ github.event.inputs.to_year }}"
          TO_MONTH="${{ github.event.inputs.to_month }}"

          if [ -n "$START_MONTH" ]; then
            # New YYYY-MM format
            CMD="--start $START_MONTH"
            if [ -n "$END_MONTH" ]; then
              CMD="$CMD --end $END_MONTH"
            fi
          else
            # Legacy format: convert to YYYY-MM
            PADDED_FROM_MONTH=$(printf "%02d" "$FROM_MONTH")
            CMD="--start ${FROM_YEAR}-${PADDED_FROM_MONTH}"
            if [ -n "$TO_YEAR" ] && [ -n "$TO_MONTH" ]; then
              PADDED_TO_MONTH=$(printf "%02d" "$TO_MONTH")
              CMD="$CMD --end ${TO_YEAR}-${PADDED_TO_MONTH}"
            fi
          fi

          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      - name: Ingest historical tenders into tenders_ingested
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.run_ingestion_historical ${{ steps.args.outputs.cmd }}
