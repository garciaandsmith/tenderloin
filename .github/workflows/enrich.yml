name: Enrich Tenders

# Enrichment now happens at write time inside the capture upsert, so this
# workflow is manual-only.  Run it when:
#   - You need to backfill rows captured before write-time enrichment was
#     introduced (leave full_rescan false — only NULL-label rows are touched).
#   - You have updated public/cpv-data.json and want to refresh all labels
#     (set full_rescan true).

on:
  workflow_dispatch:
    inputs:
      full_rescan:
        description: >
          Re-enrich ALL tenders (use after updating cpv-data.json).
          Leave false for a targeted backfill of rows that still have no labels.
        required: false
        type: boolean
        default: false
      batch_size:
        description: 'Rows fetched per Supabase request (default: 500)'
        required: false
        type: string
        default: '500'
      limit:
        description: >
          Max tenders to process this run (leave blank for no limit).
          Useful with full_rescan to spread a large backfill over several runs.
        required: false
        type: string
        default: ''

jobs:
  enrich:
    name: Translate CPV codes and region codes to human-readable labels
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Enrich tenders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS="--batch-size ${{ inputs.batch_size || '500' }}"
          if [ "${{ inputs.full_rescan }}" = "true" ]; then
            ARGS="$ARGS --full-rescan"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          python -m pipeline.run_enrich $ARGS

      - name: Notify on failure
        if: failure()
        run: |
          echo "Enrich job failed at $(date -u). Check the Actions log."
