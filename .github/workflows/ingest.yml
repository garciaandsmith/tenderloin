name: Daily Tender Ingestion

on:
  schedule:
    # Runs daily at 08:00 UTC — after the existing capture pipeline at 07:00
    - cron: '0 8 * * *'
  # Allow manual trigger from GitHub Actions UI or via the admin panel
  workflow_dispatch:

jobs:
  ingest:
    name: Ingest tenders into tenders_ingested
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi

      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.run_ingestion

      - name: Notify on failure
        if: failure()
        run: |
          echo "Ingestion job failed at $(date -u). Check the Actions log."
