name: Daily PLACSP Capture

on:
  schedule:
    # Runs daily at 07:00 UTC (09:00 CET / 08:00 GMT)
    - cron: '0 7 * * *'
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  capture:
    name: Capture → Filter → Score
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi

      # ── Step 1: Capture ────────────────────────────────────────────────────
      - name: Capture tenders from PLACSP
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.run_capture

      # ── Step 2: Filter ─────────────────────────────────────────────────────
      - name: Apply per-project hard filters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.run_filter

      # ── Step 3: Score ──────────────────────────────────────────────────────
      - name: Download per-project scoring models
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p models
          gh release download scoring-model-latest \
            --repo ${{ github.repository }} \
            --pattern "scoring_*_v????????.pkl" \
            --dir models/ \
            --clobber 2>/dev/null \
          || echo "No model release found — scoring will be skipped for projects without a model. Run the retrain workflow to create initial models."

      - name: Score filter-passing tenders (per project)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.run_score

      - name: Notify on failure
        if: failure()
        run: |
          echo "Capture job failed at $(date -u). Check the Actions log."
          # Add Slack/email notification here if needed in the future.
