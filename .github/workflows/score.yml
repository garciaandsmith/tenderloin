name: Score Inbox Tenders
run-name: "score:${{ inputs.project_id || 'all' }}"

on:
  # Trigger manually from the GitHub Actions UI or via API (e.g. from the Actualizar Inbox button)
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Project UUID to score (leave empty to score all active projects)'
        required: false
        type: string

jobs:
  score:
    name: Filter → Score
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f pipeline/requirements.txt ]; then pip install -r pipeline/requirements.txt; fi

      # ── Step 1: Reset (only when a specific project is targeted) ──────────
      # When triggered via "Actualizar Inbox" for a specific project we want a
      # full re-evaluation: clear stale filter results and model scores so the
      # filter starts from scratch (max_evaluated_id = 0) and the scoring step
      # re-scores every tender that now passes.  The Next.js /refresh route
      # attempts the same delete but relies on SUPABASE_SERVICE_ROLE_KEY being
      # available as a Next.js env var, which may not always be the case.
      # Doing it here in the workflow guarantees the service-role key is present.
      - name: Reset filter and score results for project
        if: ${{ inputs.project_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          python - <<'EOF'
          import os
          from supabase import create_client
          client = create_client(os.environ["SUPABASE_URL"], os.environ["SUPABASE_SERVICE_ROLE_KEY"])
          pid = os.environ["PROJECT_ID"]
          r1 = client.table("tender_filter_results").delete().eq("project_id", pid).execute()
          r2 = client.table("tender_model_scores").delete().eq("project_id", pid).execute()
          print(f"Reset complete for project {pid}")
          EOF

      # ── Step 2: Filter ─────────────────────────────────────────────────────
      # Catches any tenders not yet evaluated since the last daily filter run.
      - name: Apply per-project hard filters
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            python -m pipeline.run_filter --project-id "$PROJECT_ID"
          else
            python -m pipeline.run_filter
          fi

      # ── Step 2: Score ──────────────────────────────────────────────────────
      # Applies the existing trained model — training is a separate process.
      - name: Download latest scoring models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download scoring-model-latest \
            --repo ${{ github.repository }} \
            --pattern "scoring_*_v????????.pkl" \
            --dir models \
            --clobber || echo "No model release found yet — scoring step will be skipped."

      - name: Score active tenders (per project)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          if [ -n "$PROJECT_ID" ]; then
            python -m pipeline.run_score --project-id "$PROJECT_ID"
          else
            python -m pipeline.run_score
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "Score job failed at $(date -u) for project '${{ inputs.project_id }}'. Check the Actions log."
